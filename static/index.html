<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>TrascendencIA Sindical</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/duotone/style.css" />

  <style>
    :root {
      /* Paleta de la Plataforma Sindical Digital */
      --bg-body: #1b2e45; 
      --panel-base: 46, 79, 119;
      --primary: #4da1a8; 
      --primary-light: #7ad1d6;
      --text-main: #f0fdfa; 
      --text-muted: #bce9eb;
      --ring: rgba(77, 161, 168, .35);
      --font-main: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: transparent; /* El fondo lo pone el iframe contenedor */
      color: var(--text-main);
      font-family: var(--font-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Ocultamos scrollbars para un look más nativo */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(77, 161, 168, 0.3);
      border-radius: 10px;
    }

    /* Contenedor del Chat */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 85%;
      animation: fadeIn 0.3s ease forwards;
    }

    .message.user {
      margin-left: auto;
      flex-direction: row-reverse;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Avatares minimizados con Iconos */
    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    .avatar.bot {
      background: rgba(var(--panel-base), 0.8);
      color: var(--primary-light);
      border: 1px solid var(--ring);
    }

    .avatar.user {
      background: var(--primary);
      color: var(--bg-body);
    }

    /* Burbujas de chat */
    .bubble {
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.5;
      word-wrap: break-word;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .message.bot .bubble {
      background: rgba(var(--panel-base), 0.4);
      border: 1px solid var(--ring);
      color: var(--text-main);
      border-radius: 16px 16px 16px 4px;
    }

    .message.user .bubble {
      background: var(--primary);
      color: var(--bg-body);
      border-radius: 16px 16px 4px 16px;
      font-weight: 500;
    }

    /* Área de Entrada */
    #input-area {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(21, 35, 54, 0.95);
      border-top: 1px solid var(--ring);
    }

    #texto {
      flex: 1;
      padding: 10px 16px;
      background: rgba(10, 20, 29, 0.8);
      color: var(--text-main);
      border: 1px solid var(--ring);
      outline: none;
      font-size: 14px;
      border-radius: 24px;
      font-family: var(--font-main);
      transition: all 0.2s ease;
    }

    #texto:focus {
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(77, 161, 168, 0.2);
    }

    #texto::placeholder {
      color: rgba(188, 233, 235, 0.5);
    }

    #enviar {
      background: var(--primary);
      color: var(--bg-body);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(77, 161, 168, 0.3);
    }

    #enviar:hover:not(:disabled) {
      background: var(--primary-light);
      transform: scale(1.05);
    }

    #enviar:disabled {
      background: rgba(77, 161, 168, 0.3);
      color: rgba(21, 35, 54, 0.5);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Indicador de escritura (opcional) */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 8px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: var(--primary-light);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="chat-container"></div>

  <div id="input-area">
    <input type="text" id="texto" placeholder="Escribe tu duda del CCT..." autocomplete="off"/>
    <button id="enviar" title="Enviar mensaje">
      <i class="ph-bold ph-paper-plane-right"></i>
    </button>
  </div>

  <script>
    const chatEl = document.getElementById('chat-container');
    const txtEl  = document.getElementById('texto');
    const btnEl  = document.getElementById('enviar');
    const history = [];

    // Iconos para los avatares usando Phosphor
    const botIcon = '<i class="ph-duotone ph-robot"></i>';
    const userIcon = '<i class="ph-bold ph-user"></i>';

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      
      const avatar = document.createElement('div');
      avatar.className = `avatar ${role}`;
      avatar.innerHTML = role === 'bot' ? botIcon : userIcon;
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text; // Mantiene seguridad contra inyecciones HTML
      
      msg.append(role === 'bot' ? avatar : '', bubble, role === 'user' ? avatar : '');
      chatEl.appendChild(msg);
      scrollToBottom();
    }

    function appendTypingIndicator() {
      const msg = document.createElement('div');
      msg.className = `message bot`;
      msg.id = 'typing-indicator';
      
      const avatar = document.createElement('div');
      avatar.className = `avatar bot`;
      avatar.innerHTML = botIcon;
      
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      
      msg.append(avatar, bubble);
      chatEl.appendChild(msg);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      const indicator = document.getElementById('typing-indicator');
      if (indicator) {
        indicator.remove();
      }
    }

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    btnEl.onclick = async () => {
      const pregunta = txtEl.value.trim();
      if (!pregunta) return;
      
      history.push({ role: 'user', content: pregunta });
      appendMessage('user', pregunta);
      
      txtEl.value = '';
      btnEl.disabled = true;
      
      appendTypingIndicator();

      try {
        const res = await fetch("/consulta", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history })
        });
        
        const data = await res.json();
        removeTypingIndicator();
        
        const reply = data.respuesta || data.error;
        history.push({ role: 'assistant', content: reply });
        appendMessage('bot', reply);
      } catch (err) {
        removeTypingIndicator();
        appendMessage('bot', `❌ Error de conexión: No se pudo enlazar con la base de datos sindical. Intenta nuevamente.`);
      }
      
      btnEl.disabled = false;
      txtEl.focus();
    };

    txtEl.addEventListener('keypress', e => {
      if (e.key === 'Enter') btnEl.click();
    });

    // Saludo inicial automático
    window.addEventListener('load', () => {
      const welcome = '¡Hola, Compañero! 👋 Soy TrascendencIA. Estoy listo para orientarte con cualquier duda sobre los estatutos y el Contrato Colectivo de Trabajo.';
      appendMessage('bot', welcome);
      history.push({ role: 'assistant', content: welcome });
    });
  </script>
</body>
</html>
